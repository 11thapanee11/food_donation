spring.application.name=food_donation
server.port=8082
spring.datasource.url=jdbc:mysql://localhost:3307/food_donation_db?characterEncoding=UTF-8&serverTimezone=Asia/Bangkok&useLegacyDatetimeCode=false
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jackson.time-zone=Asia/Bangkok

# spring.mvc.view.prefix=/WEB-INF/jsp/
# spring.mvc.view.suffix=.jsp

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always

spring.devtools.livereload.enabled=true

jwt.secret=your-very-long-and-secure-random-string-at-least-32-chars

logging.level.org.springframework.web=DEBUG


